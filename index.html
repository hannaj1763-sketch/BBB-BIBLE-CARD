<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BBB 주제별 성경암송 3D 갤러리 & 오늘의 모임</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #0d1117;
            --card-bg: rgba(22, 27, 34, 0.94);
            --card-border: rgba(205, 162, 110, 0.4);
            --accent-gold: #cda26e;
            --accent-gold-light: #e6c294;
            --text-main: #f0f6fc;
            --text-sub: #8b949e;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: -apple-system, BlinkMacSystemFont, "Pretendard", "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            overflow: hidden;
            height: 100vh;
            height: 100dvh;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            position: relative;
            user-select: none;
        }

        header {
            padding: 14px 22px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 50;
            background: rgba(13, 17, 23, 0.96);
            border-bottom: 1px solid rgba(255, 255, 255, 0.06);
            gap: 10px;
        }

        h1 {
            font-size: 1.15rem;
            color: var(--accent-gold);
            letter-spacing: 0.5px;
            font-weight: 700;
            white-space: nowrap;
        }

        .header-right {
            display: flex;
            align-items: center;
            gap: 8px;
            flex-wrap: wrap;
        }

        .filters {
            display: flex;
            gap: 6px;
            overflow-x: auto;
        }

        .filter-btn {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.12);
            color: var(--text-sub);
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 0.84rem;
            cursor: pointer;
            transition: all 0.25s ease;
            white-space: nowrap;
        }

        .filter-btn:hover, .filter-btn.active {
            background: var(--accent-gold);
            color: #000;
            border-color: var(--accent-gold);
            font-weight: 600;
        }

        .meeting-btn {
            background: rgba(205, 162, 110, 0.15);
            border: 1px solid var(--accent-gold);
            color: var(--accent-gold-light);
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 0.84rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.25s ease;
            white-space: nowrap;
        }

        .meeting-btn:hover, .meeting-btn.active {
            background: var(--accent-gold);
            color: #0d1117;
        }

        .spin-btn {
            background: linear-gradient(135deg, #e6c294, #cda26e);
            color: #0d1117;
            border: none;
            padding: 7px 16px;
            border-radius: 24px;
            font-size: 0.85rem;
            font-weight: 800;
            cursor: pointer;
            box-shadow: 0 4px 18px rgba(205, 162, 110, 0.45);
            transition: all 0.25s ease;
            white-space: nowrap;
        }

        .spin-btn:hover:not(:disabled) {
            background: linear-gradient(135deg, #f5d8b0, #e6c294);
            transform: translateY(-1px) scale(1.03);
            box-shadow: 0 6px 24px rgba(230, 194, 148, 0.65);
        }

        .spin-btn:disabled {
            opacity: 0.55;
            cursor: not-allowed;
        }

        #stage-container {
            flex: 1;
            perspective: 1400px;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
            cursor: grab;
            touch-action: none;
            overflow: hidden;
        }

        #stage-container:active {
            cursor: grabbing;
        }

        .carousel-3d {
            width: 100%;
            height: 100%;
            position: absolute;
            transform-style: preserve-3d;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .side-nav-btn {
            position: fixed;
            top: 50%;
            transform: translateY(-50%);
            z-index: 60;
            width: 50px;
            height: 50px;
            border-radius: 50%;
            background: rgba(22, 27, 34, 0.88);
            border: 1.5px solid rgba(205, 162, 110, 0.55);
            color: var(--accent-gold);
            font-size: 1.35rem;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            backdrop-filter: blur(8px);
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.6);
            transition: all 0.25s ease;
        }

        .side-nav-btn:hover:not(:disabled) {
            background: var(--accent-gold);
            color: #0d1117;
            transform: translateY(-50%) scale(1.08);
            box-shadow: 0 0 22px rgba(205, 162, 110, 0.5);
        }

        .side-nav-btn:disabled {
            opacity: 0.25;
            cursor: not-allowed;
        }

        .side-nav-btn.prev { left: 20px; }
        .side-nav-btn.next { right: 20px; }

        .verse-card {
            position: absolute;
            width: 280px;
            height: 380px;
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 16px;
            padding: 25px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            backdrop-filter: blur(10px);
            box-shadow: 0 15px 35px rgba(0,0,0,0.5);
            cursor: pointer;
            transition: border-color 0.3s, box-shadow 0.3s;
            backface-visibility: hidden;
        }

        /* 세로 스택 모드(5확신/8지침/60구절) */
        .carousel-3d.vertical-stack {
            transform-style: flat;
        }
        .carousel-3d.vertical-stack .verse-card {
            width: min(86vw, 340px);
            height: min(56vh, 400px);
            transition: transform 0.35s cubic-bezier(0.22, 1, 0.36, 1), opacity 0.35s ease, border-color 0.3s, box-shadow 0.3s;
            backface-visibility: visible;
        }
        .carousel-3d.vertical-stack.dragging .verse-card {
            transition: none;
        }

        .verse-card:hover {
            border-color: var(--accent-gold);
            box-shadow: 0 20px 40px rgba(205,162,110,0.25);
        }

        .card-header {
            display: flex;
            justify-content: space-between;
            font-size: 0.75rem;
            color: var(--accent-gold);
            text-transform: uppercase;
            letter-spacing: 1px;
            border-bottom: 1px solid rgba(205,162,110,0.2);
            padding-bottom: 8px;
        }

        .card-body {
            font-family: "Gowun Batang", serif;
            font-size: 1rem;
            line-height: 1.7;
            color: var(--text-main);
            word-break: keep-all;
            white-space: pre-line;
            overflow-y: auto;
            margin: 15px 0;
            flex: 1;
        }

        .card-footer {
            font-size: 0.9rem;
            font-weight: bold;
            text-align: right;
            color: var(--accent-gold);
        }

        footer {
            padding: 16px 20px;
            text-align: center;
            z-index: 20;
            background: linear-gradient(to top, rgba(13,17,23,0.95), transparent);
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 6px;
        }

        #card-counter {
            font-size: 0.95rem;
            font-weight: 600;
            color: var(--accent-gold);
            letter-spacing: 1px;
        }

        .guide-text {
            font-size: 0.8rem;
            color: var(--text-sub);
        }

        #modal {
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.84);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 100;
            backdrop-filter: blur(7px);
        }

        .modal-content {
            width: 90%;
            max-width: 460px;
            min-height: 460px;
            max-height: 85vh;
            background: #161b22;
            border: 2px solid var(--accent-gold);
            border-radius: 22px;
            padding: 32px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            box-shadow: 0 25px 60px rgba(205, 162, 110, 0.25);
            position: relative;
            animation: popIn 0.35s cubic-bezier(0.18, 0.89, 0.32, 1.28);
        }

        @keyframes popIn {
            0% { transform: scale(0.85); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }

        .close-btn {
            position: absolute;
            top: 15px; right: 20px;
            background: none; border: none;
            color: var(--text-sub);
            font-size: 1.6rem;
            cursor: pointer;
        }
        .close-btn:hover { color: var(--accent-gold); }

        #wcSpin {
            position: fixed;
            inset: 0;
            z-index: 160;
            background: radial-gradient(ellipse at 50% 42%, #232b3a 0%, #090c12 72%);
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            padding: 16px;
        }
        #wcSpin.on { display: flex; }

        #confettiCanvas {
            position: fixed;
            inset: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 165;
        }

        .sp-cat-bar {
            display: flex;
            gap: 6px;
            flex-wrap: wrap;
            justify-content: center;
            margin-bottom: 12px;
            z-index: 162;
        }
        .sp-cat-btn {
            padding: 6px 14px;
            border-radius: 99px;
            border: 1px solid rgba(205, 162, 110, 0.35);
            background: rgba(255, 255, 255, 0.06);
            color: #cbd5e1;
            font-size: 0.82rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
        }
        .sp-cat-btn.on {
            background: linear-gradient(135deg, #e6c294, #cda26e);
            color: #0d1117;
            border-color: #e6c294;
            font-weight: 800;
            box-shadow: 0 0 14px rgba(230, 194, 148, 0.45);
        }

        .sp-title {
            color: #f3d5a5;
            font-size: 1.25rem;
            font-weight: 800;
            letter-spacing: 1.5px;
            margin-bottom: 4px;
            text-shadow: 0 2px 12px rgba(230, 194, 148, 0.4);
            z-index: 162;
        }
        .sp-sub {
            color: #94a3b8;
            font-size: 0.9rem;
            margin-bottom: 8px;
            z-index: 162;
        }

        .sp-stage {
            width: 100%;
            height: 360px;
            perspective: 1100px;
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 161;
        }
        .sp-glow-ring {
            position: absolute;
            width: 260px;
            height: 260px;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(230, 194, 148, 0.22) 0%, transparent 70%);
            filter: blur(12px);
            pointer-events: none;
            animation: pulseGlow 2.4s ease-in-out infinite;
        }
        @keyframes pulseGlow {
            0%, 100% { transform: scale(0.95); opacity: 0.7; }
            50% { transform: scale(1.15); opacity: 1; }
        }

        .sp-car {
            position: absolute;
            width: 100%;
            height: 100%;
            transform-style: preserve-3d;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .sp-card {
            position: absolute;
            width: 196px;
            height: 274px;
            border-radius: 16px;
            padding: 16px;
            background: linear-gradient(160deg, rgba(30, 37, 48, 0.96), rgba(15, 19, 26, 0.98));
            border: 1.5px solid rgba(205, 162, 110, 0.4);
            box-shadow: 0 14px 35px rgba(0, 0, 0, 0.65);
            backface-visibility: hidden;
            display: flex;
            flex-direction: column;
            text-align: left;
            transition: border-color 0.35s, box-shadow 0.35s, transform 0.35s;
        }
        .sp-card .h {
            display: flex;
            justify-content: space-between;
            gap: 6px;
            font-size: 0.7rem;
            color: #cda26e;
            border-bottom: 1px solid rgba(205, 162, 110, 0.28);
            padding-bottom: 6px;
            font-weight: 700;
        }
        .sp-card .h span:last-child {
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }
        .sp-card .b {
            flex: 1;
            margin: 12px 0;
            font-family: "Gowun Batang", serif;
            font-size: 0.85rem;
            line-height: 1.65;
            color: #f0f6fc;
            word-break: keep-all;
            overflow: hidden;
        }
        .sp-card .f {
            font-size: 0.78rem;
            font-weight: 700;
            text-align: right;
            color: #e6c294;
        }
        .sp-card.win {
            border: 2px solid #ffe4b5;
            box-shadow: 0 0 0 3px rgba(255, 228, 181, 0.5), 0 0 55px rgba(230, 194, 148, 0.85);
            background: linear-gradient(160deg, #2d3648, #181e29);
        }

        .sp-badge {
            margin-top: 8px;
            background: linear-gradient(135deg, #ffe0a3, #cda26e);
            color: #0d1117;
            font-size: 0.95rem;
            font-weight: 900;
            padding: 7px 22px;
            border-radius: 24px;
            letter-spacing: 1px;
            box-shadow: 0 6px 24px rgba(230, 194, 148, 0.5);
            opacity: 0;
            transform: scale(0.75);
            transition: all 0.4s cubic-bezier(0.18, 0.89, 0.32, 1.28);
            z-index: 162;
        }
        .sp-badge.on {
            opacity: 1;
            transform: scale(1);
        }
        .sp-skip {
            margin-top: 14px;
            color: #8b949e;
            font-size: 0.8rem;
            cursor: pointer;
            z-index: 162;
        }

        #wcResultModal {
            position: fixed;
            inset: 0;
            z-index: 170;
            background: rgba(7, 9, 14, 0.92);
            display: none;
            align-items: center;
            justify-content: center;
            padding: 16px;
            backdrop-filter: blur(8px);
        }
        #wcResultModal.on { display: flex; }

        .wc-result-box {
            background: #161b22;
            border: 1.5px solid rgba(205, 162, 110, 0.5);
            border-radius: 22px;
            padding: 20px;
            width: 100%;
            max-width: 430px;
            max-height: 94vh;
            overflow-y: auto;
            text-align: center;
            box-shadow: 0 25px 65px rgba(0, 0, 0, 0.75), 0 0 35px rgba(205, 162, 110, 0.18);
        }

        .wc-card-img {
            width: 100%;
            max-height: 52vh;
            object-fit: contain;
            border-radius: 14px;
            display: block;
            margin: 0 auto 12px;
            box-shadow: 0 12px 30px rgba(0, 0, 0, 0.6);
        }
        .wc-flip {
            animation: wcflip 0.75s cubic-bezier(0.18, 0.89, 0.32, 1.28);
        }
        @keyframes wcflip {
            0% { transform: perspective(900px) rotateY(90deg) scale(0.8); opacity: 0; }
            100% { transform: perspective(900px) rotateY(0deg) scale(1); opacity: 1; }
        }

        .wc-tone {
            display: flex;
            gap: 8px;
            justify-content: center;
            margin-bottom: 10px;
        }
        .wc-tone button {
            flex: 1;
            padding: 8px 0;
            border-radius: 12px;
            border: 1px solid #30363d;
            background: #21262d;
            color: #c9d1d9;
            font-size: 0.85rem;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.2s;
        }
        .wc-tone button.on {
            background: #f0f6fc;
            color: #0d1117;
            border-color: #f0f6fc;
        }

        .wc-box-pick {
            display: flex;
            gap: 7px;
            justify-content: center;
            flex-wrap: wrap;
            margin-bottom: 14px;
        }
        .wc-box-pick button {
            width: 34px;
            height: 34px;
            border-radius: 50%;
            border: 2px solid #30363d;
            cursor: pointer;
            font-size: 11px;
            font-weight: 800;
            color: #334155;
            padding: 0;
            transition: transform 0.15s;
        }
        .wc-box-pick button:hover { transform: scale(1.1); }
        .wc-box-pick button.on {
            border-color: #fff;
            box-shadow: 0 0 0 3px var(--accent-gold);
        }

        .wc-btn-row {
            display: flex;
            gap: 8px;
            margin-bottom: 8px;
        }
        .wc-primary-btn {
            flex: 1;
            background: linear-gradient(135deg, #e6c294, #cda26e);
            color: #0d1117;
            border: none;
            padding: 12px;
            border-radius: 12px;
            font-size: 0.92rem;
            font-weight: 800;
            cursor: pointer;
        }
        .wc-secondary-btn {
            flex: 1;
            background: rgba(255, 255, 255, 0.08);
            color: #f0f6fc;
            border: 1px solid rgba(255, 255, 255, 0.18);
            padding: 12px;
            border-radius: 12px;
            font-size: 0.9rem;
            font-weight: 700;
            cursor: pointer;
        }
        .wc-secondary-btn:hover {
            background: rgba(205, 162, 110, 0.2);
            border-color: var(--accent-gold);
        }

        #meeting-view {
            display: block;
            position: fixed;
            top: var(--header-h, 64px);
            left: 0;
            right: 0;
            bottom: 0;
            background: #0d1117;
            z-index: 40;
            padding: 18px 86px;
            overflow-y: auto;
            user-select: text;
        }

        .meeting-container {
            max-width: 820px;
            margin: 0 auto 32px auto;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .meeting-card {
            background: #161b22;
            border: 1px solid var(--card-border);
            border-radius: 18px;
            padding: 22px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.4);
        }

        #meeting-editor {
            display: none;
        }

        .meeting-title-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 10px;
            margin-bottom: 14px;
            border-bottom: 1px solid rgba(205, 162, 110, 0.25);
            padding-bottom: 10px;
        }

        .meeting-title-row h2 {
            color: var(--accent-gold);
            font-size: 1.15rem;
        }

        .meeting-actions {
            display: flex;
            gap: 6px;
            flex-wrap: wrap;
        }

        .action-btn {
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.15);
            color: var(--text-main);
            padding: 6px 11px;
            border-radius: 10px;
            font-size: 0.83rem;
            cursor: pointer;
            transition: all 0.2s;
            white-space: nowrap;
        }

        .action-btn:hover:not(:disabled) {
            background: var(--accent-gold);
            color: #0d1117;
            border-color: var(--accent-gold);
            font-weight: 600;
        }

        .action-btn:disabled {
            opacity: 0.35;
            cursor: not-allowed;
        }

        .action-btn.primary {
            background: var(--accent-gold);
            color: #0d1117;
            border-color: var(--accent-gold);
            font-weight: 700;
        }

        .select-list-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(230px, 1fr));
            gap: 10px;
            max-height: 240px;
            overflow-y: auto;
            padding: 6px;
            margin-bottom: 14px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            background: #0d1117;
        }

        .select-item {
            background: rgba(22, 27, 34, 0.85);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 10px;
            padding: 10px 14px;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            flex-direction: column;
            gap: 4px;
            position: relative;
        }

        .select-item:hover {
            border-color: var(--accent-gold);
            background: rgba(205, 162, 110, 0.1);
        }

        .select-item.selected {
            background: rgba(205, 162, 110, 0.22);
            border-color: var(--accent-gold);
        }

        .select-item-badge {
            position: absolute;
            top: 8px;
            right: 10px;
            background: var(--accent-gold);
            color: #0d1117;
            font-size: 0.72rem;
            font-weight: 800;
            padding: 2px 7px;
            border-radius: 10px;
        }

        .select-item-cat {
            font-size: 0.7rem;
            color: var(--accent-gold);
            text-transform: uppercase;
        }

        .select-item-title {
            font-size: 0.9rem;
            font-weight: 600;
            padding-right: 28px;
        }

        .select-item-ref {
            font-size: 0.8rem;
            color: var(--text-sub);
        }

        .selected-queue-box {
            background: #0d1117;
            border: 1px solid rgba(205, 162, 110, 0.35);
            border-radius: 12px;
            padding: 12px;
            margin-bottom: 14px;
        }

        .selected-queue-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 8px;
            font-size: 0.85rem;
            color: var(--accent-gold);
            font-weight: 600;
        }

        .selected-queue-list {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .queue-chip {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(22, 27, 34, 0.95);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 8px;
            padding: 8px 12px;
            font-size: 0.88rem;
            gap: 8px;
        }

        .queue-chip-info {
            display: flex;
            align-items: center;
            gap: 8px;
            flex: 1;
            min-width: 0;
        }

        .queue-num {
            background: var(--accent-gold);
            color: #0d1117;
            font-weight: 800;
            font-size: 0.75rem;
            width: 22px;
            height: 22px;
            border-radius: 50%;
            display: inline-flex;
            justify-content: center;
            align-items: center;
            flex-shrink: 0;
        }

        .queue-title-text {
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .queue-controls {
            display: flex;
            gap: 4px;
            flex-shrink: 0;
        }

<body>

    <header>
        <h1>BBB 3D Scripture Gallery</h1>
        <div class="header-right">
            <button id="meeting-menu-btn" class="meeting-btn active" onclick="openMeetingView()">📖 오늘의 모임</button>
            <div class="filters">
                <button class="filter-btn" onclick="switchToGallery('all', this)">전체</button>
                <button class="filter-btn" onclick="switchToGallery('5확신', this)">5확신</button>
                <button class="filter-btn" onclick="switchToGallery('8지침', this)">8지침</button>
                <button class="filter-btn" onclick="switchToGallery('60구절', this)">60구절</button>
            </div>
            <button id="spin-btn" class="spin-btn" onclick="openSpinOverlay()">✨ 오늘의 말씀 뽑기</button>
        </div>
    </header>

    <button id="prev-btn" class="side-nav-btn prev" onclick="handleSideNav(-1)" aria-label="이전 항목">&#10094;</button>
    <button id="next-btn" class="side-nav-btn next" onclick="handleSideNav(1)" aria-label="다음 항목">&#10095;</button>

    <div id="stage-container">
        <div class="carousel-3d" id="carousel"></div>
    </div>

    <footer id="gallery-footer">
        <div id="card-counter">1 / 15</div>
        <div class="guide-text" id="gallery-guide-text">좌우로 밀어서 카드를 돌리거나 '오늘의 말씀 뽑기'를 눌러보세요.</div>
    </footer>

    <div id="modal" onclick="closeModal()">
        <div class="modal-content" onclick="event.stopPropagation()">
            <button class="close-btn" onclick="closeModal()">&times;</button>
            <div id="modal-header" class="card-header"></div>
            <div id="modal-body" class="card-body" style="font-size: 1.15rem; line-height: 1.85;"></div>
            <div style="display:flex; justify-content:space-between; align-items:center; gap:10px;">
                <button class="action-btn primary" id="modal-make-card-btn">🎨 이 말씀으로 카드 만들기</button>
                <div id="modal-footer" class="card-footer" style="font-size: 1.1rem;"></div>
            </div>
        </div>
    </div>

    <div id="wcSpin">
        <canvas id="confettiCanvas"></canvas>
        <div class="sp-cat-bar" id="spCatBar"></div>
        <div class="sp-title">✨ 오늘의 말씀 뽑기</div>
        <div class="sp-sub" id="wcSpinSub">주제를 고르고 말씀 카드를 돌려보세요</div>
        <div class="sp-stage" onclick="handleStageSpinClick()">
            <div class="sp-glow-ring"></div>
            <div class="sp-car" id="wcSpinCar"></div>
        </div>
        <div class="sp-badge" id="wcSpinBadge">✨ 오늘의 말씀</div>
        <div class="sp-skip" id="wcSpinSkipText" onclick="handleSkipClick()">화면을 누르면 바로 볼 수 있어요</div>
    </div>

    <div id="wcResultModal" onclick="if (event.target === this) closeWcResult()">
        <div class="wc-result-box">
            <img id="wcImg" class="wc-card-img" src="" alt="오늘의 말씀 카드">
            <div class="wc-tone">
                <button id="wcColor" class="on" onclick="setCardTone(false)">🌈 컬러 배경</button>
                <button id="wcGray" onclick="setCardTone(true)">⚫ 흑백 감성</button>
            </div>
            <div class="wc-box-pick" id="wcBoxPick"></div>
            <div class="wc-btn-row">
                <button class="wc-primary-btn" onclick="saveWordCard()">📥 이미지 저장</button>
                <button class="wc-secondary-btn" onclick="shareWordCard()">📤 공유하기</button>
            </div>
            <div class="wc-btn-row" style="margin-bottom: 4px;">
                <button class="wc-secondary-btn" onclick="changeCardArt()">🖼 다른 수채화 배경</button>
                <button class="wc-secondary-btn" onclick="reSpinFromResult()">🎲 다시 뽑기</button>
            </div>
            <button class="action-btn" style="margin-top:6px; width:100%;" onclick="closeWcResult()">닫기</button>
        </div>
    </div>

    <div id="meeting-view">
        <div class="meeting-container">
            <div id="meeting-editor" class="meeting-card">
                <div class="meeting-title-row">
                    <h2>📖 오늘의 모임 통독 설정</h2>
                    <div class="meeting-actions">
                        <button class="action-btn" onclick="toggleEditor()">닫기 ✕</button>
                    </div>
                </div>

                <div class="input-group">
                    <label>1. 아래 목록에서 통독할 말씀을 여러 개 클릭해서 담으세요</label>
                    <div style="display: flex; gap: 6px; margin-bottom: 8px; flex-wrap: wrap;">
                        <button class="action-btn filter-sub-btn active" onclick="filterMeetingList('all', this)">전체 (15)</button>
                        <button class="action-btn filter-sub-btn" onclick="filterMeetingList('5확신', this)">5확신</button>
                        <button class="action-btn filter-sub-btn" onclick="filterMeetingList('8지침', this)">8지침</button>
                        <button class="action-btn filter-sub-btn" onclick="filterMeetingList('60구절', this)">60구절</button>
                    </div>
                    <div id="select-list-grid" class="select-list-grid"></div>
                </div>

                <div class="selected-queue-box">
                    <div class="selected-queue-header">
                        <span id="selected-count-label">선택된 통독 목록 (0건)</span>
                        <button class="mini-btn danger" onclick="clearSelectedVerses()">전체 비우기</button>
                    </div>
                    <div id="selected-queue-list" class="selected-queue-list"></div>
                </div>

                <details style="margin-bottom: 12px; border: 1px solid rgba(255,255,255,0.1); border-radius: 10px; padding: 10px 12px; background: rgba(0,0,0,0.2);">
                    <summary style="cursor: pointer; font-size: 0.85rem; color: var(--accent-gold); font-weight: 600;">➕ 목록에 없는 성경 구절 직접 입력해서 추가하기</summary>
                    <div style="margin-top: 10px;">
                        <div class="input-group">
                            <label for="custom-ref-input">장절 / 제목</label>
                            <input type="text" id="custom-ref-input" placeholder="예: 시편 23:1-6">
                        </div>
                        <div class="input-group">
                            <label for="custom-text-input">본문 내용</label>
                            <textarea id="custom-text-input" placeholder="통독할 성경 본문을 입력하세요..."></textarea>
                        </div>
                        <button class="action-btn" onclick="addCustomVerseToQueue()">+ 통독 목록에 추가</button>
                    </div>
                </details>

                <div class="input-group">
                    <label for="meeting-memo-input">모임 나눔 주제 / 기도제목 (선택)</label>
                    <input type="text" id="meeting-memo-input" placeholder="예: 오늘 말씀에서 은혜받은 부분 나누기">
                </div>

                <div style="display: flex; gap: 8px; justify-content: flex-end; flex-wrap: wrap; margin-top: 5px;">
                    <button class="action-btn" onclick="copyShareLink()">🔗 공유 링크 복사</button>
                    <button class="action-btn primary" onclick="saveAndStartReading()">저장하고 통독하기 ▶</button>
                </div>
            </div>

            <div id="meeting-reader" class="meeting-card">
                <div class="reader-top-bar">
                    <span class="reader-progress-pill" id="meeting-step-indicator">1 / 1 번째 말씀</span>
                    <div class="meeting-actions">
                        <button class="action-btn" onclick="toggleEditor()">✏️ 말씀 선택/수정</button>
                        <button class="action-btn" onclick="copyShareLink()">🔗 공유</button>
                    </div>
                </div>

                <div id="verse-dots" class="verse-dots"></div>

                <div class="reader-header">
                    <div class="reader-ref" id="display-meeting-ref">구원의 확신 (요한일서 5:11-12)</div>
                    <div class="meeting-actions">
                        <button class="action-btn" onclick="changeFontSize(-0.1)">가-</button>
                        <button class="action-btn" onclick="changeFontSize(0.1)">가+</button>
                        <button class="action-btn" onclick="moveHighlight(-1)">▲ 이전 줄</button>
                        <button class="action-btn" onclick="moveHighlight(1)">▼ 다음 줄</button>
                    </div>
                </div>

                <div id="verse-lines-container" class="verse-lines" style="font-size: 1.05rem;"></div>

                <div id="display-meeting-memo" class="meeting-memo-box" style="display: none;"></div>

                <div class="reader-bottom-nav">
                    <span class="bottom-hint-text" style="font-size: 0.85rem; color: var(--text-sub);">문장을 클릭하면 읽고 있는 줄이 강조됩니다.</span>
                    <div class="meeting-actions">
                        <button class="action-btn" id="bottom-prev-btn" onclick="navigateMeetingVerse(-1)">◀ 이전 말씀</button>
                        <button class="action-btn primary" id="bottom-next-or-done-btn" onclick="handleBottomNextOrDone()">🙌 오늘의 통독 완료!</button>
                    </div>
                </div>

                <div id="complete-banner" class="complete-banner">
                    아멘! 오늘의 모임 말씀을 모두 함께 통독했습니다. 🙏
                </div>
            </div>
        </div>
    </div>

    <script>
        const rawData = [
            { id: 1, category: "5확신", title: "구원의 확신", reference: "요한일서 5:11-12", verse: "또 증거는 이것이니\n하나님이 우리에게 영생을 주신 것과\n이 생명이 그의 아들 안에 있는 그것이니라\n아들이 있는 자에게는 생명이 있고\n하나님의 아들이 없는 자에게는 생명이 없느니라" },
            { id: 2, category: "5확신", title: "기도응답의 확신", reference: "요한복음 16:24", verse: "지금까지는 너희가 내 이름으로 아무 것도 구하지 아니하였으나\n구하라 그리하면 받으리니\n너희 기쁨이 충만하리라" },
            { id: 3, category: "5확신", title: "승리의 확신", reference: "고린도전서 10:13", verse: "사람이 감당할 시험 밖에는\n너희가 당한 것이 없나니\n오직 하나님은 미쁘사\n너희가 감당하지 못할 시험 당함을 허락하지 아니하시고\n시험 당할 즈음에 또한 피할 길을 내사\n너희로 능히 감당하게 하시느니라" },
            { id: 4, category: "5확신", title: "사죄의 확신", reference: "요한일서 1:9", verse: "만일 우리가 우리 죄를 자백하면\n그는 미쁘시고 의로우사\n우리 죄를 사하시며\n우리를 모든 불의에서 깨끗하게 하실 것이요" },
            { id: 5, category: "5확신", title: "인도의 확신", reference: "잠언 3:5-6", verse: "너는 마음을 다하여 여호와를 신뢰하고\n네 명철을 의지하지 말라\n너는 범사에 그를 인정하라\n그리하면 네 길을 지도하시리라" },
            
            { id: 6, category: "8지침", title: "그리스도 안의 생활", reference: "요한복음 15:5", verse: "나는 포도나무요 너희는 가지라\n그가 내 안에, 내가 그 안에 거하면\n사람이 열매를 많이 맺나니\n나를 떠나서는 너희가 아무 것도 할 수 없음이라" },
            { id: 7, category: "8지침", title: "말씀에 의한 생활", reference: "사도행전 20:32", verse: "지금 내가 여러분을 주와 및 그 은혜의 말씀에 부탁하노니\n그 말씀이 여러분을 능히 든든히 세우사\n거룩하게 하심을 입은 모든 자 가운데\n기업이 있게 하시리라" },

        function updateVerticalStack() {
            const cards = carousel.querySelectorAll('.verse-card');
            const total = cards.length;
            if (total === 0) return;

            const isMobile = window.innerWidth <= 768;
            const gapY = isMobile ? 290 : 360;
            const dragShift = stackOffsetPx;

            cards.forEach((card, idx) => {
                let diff = idx - currentIndex;
                if (diff > total / 2) diff -= total;
                if (diff < -total / 2) diff += total;

                const pos = diff + (dragShift / gapY);
                const absPos = Math.abs(pos);

                if (absPos > 2.2) {
                    card.style.opacity = '0';
                    card.style.pointerEvents = 'none';
                    card.style.transform = `translate3d(0, ${pos * gapY}px, -200px) scale(0.8)`;
                    card.style.zIndex = '1';
                } else {
                    const translateY = pos * gapY;
                    const scale = Math.max(0.84, 1 - absPos * 0.09);
                    const opacity = Math.max(0, 1 - absPos * 0.48);
                    const zIndex = Math.round(20 - absPos * 5);

                    card.style.opacity = opacity.toFixed(2);
                    card.style.pointerEvents = absPos < 0.6 ? 'auto' : 'none';
                    card.style.transform = `translate3d(0, ${translateY.toFixed(1)}px, 0) scale(${scale.toFixed(3)})`;
                    card.style.zIndex = String(zIndex);
                    card.style.borderColor = absPos < 0.3 ? 'var(--accent-gold)' : 'var(--card-border)';
                }
            });

            counter.innerText = `${currentIndex + 1} / ${total}`;
        }

        function updateTransform() {
            const total = currentData.length;
            if (carouselMode === 'vertical') {
                updateVerticalStack();
                return;
            }
            const stepAngle = 360 / total;
            carousel.style.transform = `rotateY(${currentAngle}deg)`;
            const activeIdx = Math.round(-currentAngle / stepAngle) % total;
            currentIndex = (activeIdx + total) % total;
            counter.innerText = `${currentIndex + 1} / ${total}`;
        }

        function rotateCarousel(direction) {
            if (isSpinning) return;
            const total = currentData.length;
            if (carouselMode === 'vertical') {
                stackOffsetPx = 0;
                currentIndex = (currentIndex + direction + total) % total;
                updateVerticalStack();
                return;
            }
            const theta = 360 / total;
            carousel.style.transition = 'transform 0.35s cubic-bezier(0.25, 0.8, 0.25, 1)';
            currentAngle -= direction * theta;
            updateTransform();
        }

            carousel.style.transition = 'transform 0.35s ease';

        let isDragging = false;
        let startX = 0;
        let startY = 0;
        const stage = document.getElementById('stage-container');

        stage.addEventListener('mouseenter', () => { isHoveringStage = true; });

        stage.addEventListener('mousedown', (e) => {
            if (isSpinning) return;
            isDragging = true;
            dragMoved = false;
            startX = e.clientX;
            startY = e.clientY;
            if (carouselMode === 'vertical') {
                carousel.classList.add('dragging');
            } else {
                carousel.style.transition = 'none';
            }
        });

        window.addEventListener('mousemove', (e) => {
            if (!isDragging || isSpinning) return;
            const deltaX = e.clientX - startX;
            const deltaY = e.clientY - startY;
            if (Math.abs(deltaX) > 4 || Math.abs(deltaY) > 4) dragMoved = true;

            if (carouselMode === 'vertical') {
                stackOffsetPx += deltaY;
                startY = e.clientY;
                updateVerticalStack();
            } else {
                startX = e.clientX;
                currentAngle += deltaX * 0.4;
                updateTransform();
            }
        });

        window.addEventListener('mouseup', () => {
            if (!isDragging) return;
            isDragging = false;
            if (carouselMode === 'vertical') {
                carousel.classList.remove('dragging');
                const total = currentData.length;
                if (stackOffsetPx < -45) {
                    currentIndex = (currentIndex + 1) % total;
                } else if (stackOffsetPx > 45) {
                    currentIndex = (currentIndex - 1 + total) % total;
                }
                stackOffsetPx = 0;
                updateVerticalStack();
            }
            setTimeout(() => { dragMoved = false; }, 50);
        });

        stage.addEventListener('touchstart', (e) => {
            if (isSpinning) return;
            isDragging = true;
            dragMoved = false;
            startX = e.touches[0].clientX;

            if (carouselMode === 'vertical') {

        window.addEventListener('touchmove', (e) => {

            if (Math.abs(deltaX) > 4 || Math.abs(deltaY) > 4) dragMoved = true;

            if (carouselMode === 'vertical') {
                stackOffsetPx += deltaY;
                startY = e.touches[0].clientY;
                updateVerticalStack();
            } else {

        async function loadArtPool() {
            if (artPool.length > 0) return artPool;
            try {
                const res = await fetch(`https://data.jsdelivr.com/v1/packages/gh/${GALLERY_USER}/${GALLERY_REPO}@main?structure=flat`);
                if (res.ok) {
                    const data = await res.json();
                    const urls = (data.files || [])
                        .map(f => String(f.name).replace(/^\//, ''))
                        .filter(p => /^artworks\/[^/]+\/[^/]+\.(jpg|jpeg|png|webp)$/i.test(p) && !/^artworks\/01\//i.test(p))
                        .map(p => `https://raw.githubusercontent.com/${GALLERY_USER}/${GALLERY_REPO}/main/` + p.split('/').map(encodeURIComponent).join('/'));
                    if (urls.length > 0) {
                        artPool = urls;
                    }
                }
            } catch (e) {}
            return artPool;
        }

        let audioCtx = null;
        function playTone(freq, duration = 0.08, type = 'sine', gainVal = 0.06) {
            try {
                if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                if (audioCtx.state === 'suspended') audioCtx.resume();
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.type = type;
                osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
                gain.gain.setValueAtTime(gainVal, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + duration);
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.start();
                osc.stop(audioCtx.currentTime + duration);
            } catch (e) {}
        }

        function playCelebrationChime() {

        let confettiAnimId = null;
        function launchConfetti() {
            const canvas = document.getElementById('confettiCanvas');
            const ctx = canvas.getContext('2d');
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;

            const colors = ['#ffe0a3', '#cda26e', '#ffffff', '#f472b6', '#38bdf8', '#34d399'];
            const pieces = Array.from({ length: 85 }, () => ({
                x: canvas.width / 2 + (Math.random() - 0.5) * 180,
                y: canvas.height * 0.45,
                vx: (Math.random() - 0.5) * 16,
                vy: (Math.random() - 0.75) * 18,
                size: 5 + Math.random() * 6,
                color: colors[Math.floor(Math.random() * colors.length)],
                rot: Math.random() * 360,
                vrot: (Math.random() - 0.5) * 14,
                alpha: 1
            }));

            if (confettiAnimId) cancelAnimationFrame(confettiAnimId);
            function step() {
                ctx.clearRect(0, 0, canvas.width, canvas.height);
                let alive = 0;
                pieces.forEach(p => {
                    p.x += p.vx;
                    p.y += p.vy;
                    p.vy += 0.42;
                    p.vx *= 0.98;
                    p.rot += p.vrot;
                    p.alpha -= 0.011;
                    if (p.alpha > 0) {
                        alive++;
                        ctx.save();
                        ctx.globalAlpha = p.alpha;
                        ctx.translate(p.x, p.y);
                        ctx.rotate((p.rot * Math.PI) / 180);
                        ctx.fillStyle = p.color;
                        ctx.fillRect(-p.size / 2, -p.size / 2, p.size, p.size * 0.6);
                        ctx.restore();
                    }
                });
                if (alive > 0) {
                    confettiAnimId = requestAnimationFrame(step);
                } else {
                    ctx.clearRect(0, 0, canvas.width, canvas.height);
                }
            }
            step();
        }

        function startVerseSpin() {
            isSpinning = true;
            const ov = document.getElementById('wcSpin');
            const car = document.getElementById('wcSpinCar');
            const badge = document.getElementById('wcSpinBadge');
            const sub = document.getElementById('wcSpinSub');
            const skipText = document.getElementById('wcSpinSkipText');

            const pool = spinCategory === 'all' ? rawData : rawData.filter(x => x.category === spinCategory);
            const unseen = pool.filter(x => !seenVerseIds.has(x.id));
            const pickFrom = unseen.length > 0 ? unseen : pool;
            if (unseen.length === 0) seenVerseIds.clear();
            const chosen = pickFrom[Math.floor(Math.random() * pickFrom.length)];
            seenVerseIds.add(chosen.id);

            let deck = pool.filter(x => x.id !== chosen.id).sort(() => Math.random() - 0.5).slice(0, 14);
            deck.splice(Math.floor(Math.random() * (deck.length + 1)), 0, chosen);
            if (deck.length < 6) {
                deck = deck.concat(deck, deck).slice(0, Math.max(6, deck.length));
            }

            const n = deck.length;
            const theta = 360 / n;
            const targetIdx = deck.indexOf(chosen);
            const radius = Math.max(245, Math.round(112 / Math.tan(Math.PI / n)));

            car.innerHTML = deck.map((x, i) => `
                <div class="sp-card" style="transform: rotateY(${theta * i}deg) translateZ(${radius}px)">
                    <div class="h"><span>${x.category}</span><span>${x.title}</span></div>
                    <div class="b">${x.verse.replace(/\n/g, '<br>')}</div>
                    <div class="f">${x.reference}</div>
                </div>
            `).join('');

            car.style.transition = 'none';
            car.style.transform = `translateZ(-${radius}px) rotateY(0deg)`;
            badge.classList.remove('on');
            sub.innerText = '말씀 카드가 힘차게 돌아가요…';
            skipText.innerText = '화면을 누르면 바로 볼 수 있어요';
            ov.classList.add('on');

            const extraSpins = (4 + Math.floor(Math.random() * 2)) * 360;
            const endAngle = -extraSpins - targetIdx * theta;

            let tickCount = 0;
            const tickInterval = setInterval(() => {
                tickCount++;
                playTone(320 + (tickCount % 5) * 45, 0.04, 'triangle', 0.03);
                if (tickCount > 28) clearInterval(tickInterval);
            }, 105);

            let finished = false;
            let t1 = null;
            let t2 = null;

            const finishSpin = async (fast) => {
                if (finished) return;
                finished = true;
                clearInterval(tickInterval);
                clearTimeout(t1);
                clearTimeout(t2);
                wcSpinSkip = null;

                if (fast) {
                    car.style.transition = 'none';
                    car.style.transform = `translateZ(-${radius}px) rotateY(${endAngle}deg)`;
                }

                car.children[targetIdx].classList.add('win');
                badge.classList.add('on');
                sub.innerText = `${chosen.title} · ${chosen.reference}`;
                skipText.innerText = '잠시 후 나만의 말씀 카드가 열립니다…';

                playCelebrationChime();
                launchConfetti();

                setTimeout(async () => {
                    isSpinning = false;
                    ov.classList.remove('on');
                    await openCardCreatorForItem(chosen);
                }, fast ? 450 : 1250);
            };

            requestAnimationFrame(() => {
                requestAnimationFrame(() => {
                    car.style.transition = 'transform 3.5s cubic-bezier(0.12, 0.85, 0.18, 1)';
                    car.style.transform = `translateZ(-${radius}px) rotateY(${endAngle}deg)`;
                    t1 = setTimeout(() => finishSpin(false), 3600);
                });
            });

            t2 = setTimeout(() => {
                wcSpinSkip = () => finishSpin(true);
            }, 350);
        }

        function loadImg(src) {
            return new Promise((res, rej) => {
                const img = new Image();
                img.crossOrigin = 'anonymous';
                img.onload = () => res(img);
                img.onerror = rej;
                img.src = src;
            });
        }

        async function renderVerseArtCard(state) {
            const W = 1080, H = 1350;
            const cv = document.createElement('canvas');
            cv.width = W;
            cv.height = H;
            const g = cv.getContext('2d');

            try {
                await document.fonts.ready;
            } catch (e) {}
            const font = '"Gowun Batang", serif';

            const baseGrad = g.createLinearGradient(0, 0, W, H);
            baseGrad.addColorStop(0, '#2c2520');
            baseGrad.addColorStop(0.5, '#1d2430');
            baseGrad.addColorStop(1, '#12161f');
            g.fillStyle = baseGrad;
            g.fillRect(0, 0, W, H);

            if (state.artUrl) {
                try {
                    const img = await loadImg(state.artUrl);
                    const s = Math.max(W / img.width, H / img.height);
                    const w = img.width * s;
                    const h = img.height * s;
                    if (state.bw) g.filter = 'grayscale(1)';
                    g.drawImage(img, (W - w) / 2, (H - h) / 2, w, h);
                    g.filter = 'none';
                } catch (e) {}
            }

            const shade = g.createLinearGradient(0, H * 0.35, 0, H);
            shade.addColorStop(0, 'rgba(0,0,0,0.05)');
            shade.addColorStop(1, 'rgba(0,0,0,0.52)');
            g.fillStyle = shade;
            g.fillRect(0, 0, W, H);

            g.strokeStyle = 'rgba(255, 233, 184, 0.45)';
            g.lineWidth = 3;
            g.strokeRect(36, 36, W - 72, H - 72);

            const lines = state.item.verse.split(/\r?\n/).map(l => l.trim()).filter(Boolean);
            const size = lines.length >= 6 ? 38 : lines.length >= 5 ? 42 : 46;
            const lh = size * 1.5;
            const titleH = 60;
            const panelH = lines.length * lh + 165 + titleH;
            const panelY = H - 76 - panelH;

            const bx = WC_BOXES.find(b => b.id === state.box) || WC_BOXES[0];

            if (bx.fill) {
                g.save();
                g.shadowColor = 'rgba(0,0,0,0.3)';
                g.shadowBlur = 32;
                g.shadowOffsetY = 10;
                g.fillStyle = bx.fill;
                g.beginPath();
                if (g.roundRect) g.roundRect(76, panelY, W - 152, panelH, 32);
                else g.rect(76, panelY, W - 152, panelH);
                g.fill();
                g.restore();
            }

            g.save();
            g.textAlign = 'center';
            g.textBaseline = 'alphabetic';
            if (!bx.fill) {
                g.shadowColor = 'rgba(0,0,0,0.82)';
                g.shadowBlur = 16;
                g.shadowOffsetY = 3;
            }

            const drawLine = (txt, x, y) => {
                if (!bx.fill) {
                    g.lineJoin = 'round';
                    g.lineWidth = 8;
                    g.strokeStyle = 'rgba(20, 16, 12, 0.78)';
                    g.strokeText(txt, x, y);
                }
                g.fillText(txt, x, y);
            };

            g.font = `bold 30px ${font}`;
            g.fillStyle = bx.ref;
            drawLine(`〈 ${state.item.category} · ${state.item.title} 〉`, W / 2, panelY + 74);

            g.font = `${size}px ${font}`;
            g.fillStyle = bx.text;
            lines.forEach((line, idx) => {
                drawLine(line, W / 2, panelY + 66 + titleH + size * 0.85 + idx * lh);
            });

            g.font = `bold 34px ${font}`;
            g.fillStyle = bx.ref;
            drawLine(state.item.reference, W / 2, panelY + panelH - 42);
            g.restore();

            g.save();
            g.font = 'bold 26px sans-serif';
            g.textAlign = 'right';
            g.fillStyle = 'rgba(255,255,255,0.85)';
            g.fillText('BBB Scripture · Art © J.J', W - 56, H - 48);
            g.restore();

            return cv.toDataURL('image/png');
        }

        function renderBoxPalette(activeId) {
            const pick = document.getElementById('wcBoxPick');
            pick.innerHTML = WC_BOXES.map(b => {
                const bg = b.fill
                    ? b.fill.replace(/0\.9\)$/, '1)')
                    : 'repeating-conic-gradient(#cbd5e1 0 25%, #f8fafc 0 50%) 50% / 12px 12px';
                return `<button class="${b.id === activeId ? 'on' : ''}" title="${b.label || b.id}" onclick="setCardBox('${b.id}')" style="background:${bg}">${b.label}</button>`;
            }).join('');
        }

        async function openCardCreatorForItem(item) {
            const arts = await loadArtPool();
            const artUrl = arts.length > 0 ? arts[Math.floor(Math.random() * arts.length)] : '';
            wcCurrent = {
                item,
                artUrl,
                bw: false,
                box: 'clear',
                dataUrl: ''
            };

            const img = document.getElementById('wcImg');
            img.classList.remove('wc-flip');
            img.src = '';
            document.getElementById('wcResultModal').classList.add('on');
            await refreshWcCardImage(true);
        }

        async function refreshWcCardImage(flip = false) {
            if (!wcCurrent) return;
            document.getElementById('wcColor').classList.toggle('on', !wcCurrent.bw);
            document.getElementById('wcGray').classList.toggle('on', wcCurrent.bw);
            renderBoxPalette(wcCurrent.box);

            const url = await renderVerseArtCard(wcCurrent);
            wcCurrent.dataUrl = url;
            const img = document.getElementById('wcImg');
            img.src = url;
            if (flip) {
                void img.offsetWidth;
                img.classList.add('wc-flip');
            }
        }

        async function setCardTone(bw) {
            if (!wcCurrent || wcCurrent.bw === bw) return;
            wcCurrent.bw = bw;
            await refreshWcCardImage(false);
        }

        async function setCardBox(boxId) {
            if (!wcCurrent || wcCurrent.box === boxId) return;
            wcCurrent.box = boxId;
            await refreshWcCardImage(false);
        }

        async function changeCardArt() {
            if (!wcCurrent) return;
            const arts = await loadArtPool();
            if (arts.length <= 1) return;
            let nextUrl = wcCurrent.artUrl;
            while (nextUrl === wcCurrent.artUrl) {
                nextUrl = arts[Math.floor(Math.random() * arts.length)];
            }
            wcCurrent.artUrl = nextUrl;
            await refreshWcCardImage(true);
        }

        function reSpinFromResult() {
            closeWcResult();
            openSpinOverlay();
        }

        function closeWcResult() {
            document.getElementById('wcResultModal').classList.remove('on');
        }

        function saveWordCard() {
            if (!wcCurrent || !wcCurrent.dataUrl) return;
            const filename = `BBB_말씀카드_${wcCurrent.item.reference.replace(/[\s:]/g, '_')}.png`;
            const a = document.createElement('a');
            a.href = wcCurrent.dataUrl;
            a.download = filename;
            document.body.appendChild(a);
            a.click();
            a.remove();
        }

        async function shareWordCard() {
            if (!wcCurrent || !wcCurrent.dataUrl) return;
            const filename = `BBB_말씀카드_${wcCurrent.item.reference.replace(/[\s:]/g, '_')}.png`;
            try {
                const res = await fetch(wcCurrent.dataUrl);
                const blob = await res.blob();
                const file = new File([blob], filename, { type: 'image/png' });
                if (navigator.canShare && navigator.canShare({ files: [file] })) {
                    await navigator.share({
                        title: `오늘의 말씀 - ${wcCurrent.item.reference}`,
                        text: `${wcCurrent.item.title} (${wcCurrent.item.reference})`,
                        files: [file]
                    });
                    return;
                }
            } catch (e) {
                if (e.name === 'AbortError') return;
            }
            saveWordCard();
            alert('말씀 카드 이미지가 저장되었습니다! 카톡방에 사진을 첨부해 공유해 보세요.');
        }

        /* =========================================================
           📖 오늘의 모임 (다중 선택 / 순서 조정 / 공유 링크)
           ========================================================= */
        let currentFontSize = 1.05;
        let highlightedLineIndex = 0;
        let currentFilterCat = 'all';
        let draftVerses = [];
        let savedVerses = [];
        let savedMemo = "";
        let activeMeetingIdx = 0;

        function syncHeaderHeight() {
            const header = document.querySelector('header');
            if (header) {
                document.documentElement.style.setProperty('--header-h', header.offsetHeight + 'px');
            }
        }
        window.addEventListener('resize', () => {
            syncHeaderHeight();
            if (!isMeetingOpen()) renderCarousel();
        });

        function openMeetingView() {
            if (isSpinning) return;
            syncHeaderHeight();
            document.body.classList.add('meeting-open');
            document.getElementById('meeting-view').style.display = 'block';
            document.getElementById('meeting-menu-btn').classList.add('active');
            document.querySelectorAll('.filter-btn').forEach(btn => btn.classList.remove('active'));
            updateSideNavButtonsState();
        }

        function closeMeetingView() {
            document.body.classList.remove('meeting-open');
            document.getElementById('meeting-view').style.display = 'none';
            document.getElementById('meeting-menu-btn').classList.remove('active');
            document.getElementById('prev-btn').disabled = false;
            document.getElementById('next-btn').disabled = false;
        }

        function renderSelectList(cat) {
            currentFilterCat = cat;
            const grid = document.getElementById('select-list-grid');
            grid.innerHTML = '';
            let list = rawData;
            if (cat !== 'all') {
                list = rawData.filter(i => i.category === cat);
            }

            list.forEach(item => {
                const queueIdx = draftVerses.findIndex(v => v.id === item.id);
                const isSelected = queueIdx !== -1;

                const div = document.createElement('div');
                div.className = 'select-item' + (isSelected ? ' selected' : '');
                div.innerHTML = `
                    ${isSelected ? `<span class="select-item-badge">${queueIdx + 1}번째</span>` : ''}
                    <div class="select-item-cat">${item.category}</div>
                    <div class="select-item-title">${item.title}</div>
                    <div class="select-item-ref">${item.reference}</div>
                `;
                div.onclick = () => toggleDraftVerse(item);
                grid.appendChild(div);
            });
        }

        function filterMeetingList(cat, btn) {
            document.querySelectorAll('.filter-sub-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            renderSelectList(cat);
        }

        function toggleDraftVerse(item) {
            const idx = draftVerses.findIndex(v => v.id === item.id);
            if (idx !== -1) {
                draftVerses.splice(idx, 1);
            } else {
                draftVerses.push({
                    id: item.id,
                    ref: `${item.title} (${item.reference})`,
                    text: item.verse
                });
            }
            renderSelectList(currentFilterCat);
            renderDraftQueue();
        }

        function addCustomVerseToQueue() {
            const ref = document.getElementById('custom-ref-input').value.trim();
            const text = document.getElementById('custom-text-input').value.trim();
            if (!text) {
                alert("추가할 성경 본문을 입력해 주세요!");
                return;
            }
            draftVerses.push({
                id: 'custom_' + Date.now(),
                ref: ref || "추가된 통독 말씀",
                text: text
            });
            document.getElementById('custom-ref-input').value = '';
            document.getElementById('custom-text-input').value = '';
            renderDraftQueue();
        }

        function moveDraftItem(idx, step) {
            const target = idx + step;
            if (target < 0 || target >= draftVerses.length) return;
            const temp = draftVerses[idx];
            draftVerses[idx] = draftVerses[target];
            draftVerses[target] = temp;
            renderSelectList(currentFilterCat);
            renderDraftQueue();
        }

        function removeDraftItem(idx) {
            draftVerses.splice(idx, 1);
            renderSelectList(currentFilterCat);
            renderDraftQueue();
        }

        function clearSelectedVerses() {
            draftVerses = [];
            renderSelectList(currentFilterCat);
            renderDraftQueue();
        }

        function renderDraftQueue() {
            const listEl = document.getElementById('selected-queue-list');
            document.getElementById('selected-count-label').innerText = `선택된 통독 목록 (${draftVerses.length}건)`;
            listEl.innerHTML = '';

            if (draftVerses.length === 0) {
                listEl.innerHTML = `<div style="font-size:0.83rem; color:var(--text-sub); padding:6px;">아직 선택된 말씀이 없습니다. 위 목록에서 말씀을 클릭해 주세요.</div>`;
                return;
            }

            draftVerses.forEach((v, idx) => {
                const row = document.createElement('div');
                row.className = 'queue-chip';
                row.innerHTML = `
                    <div class="queue-chip-info">
                        <span class="queue-num">${idx + 1}</span>
                        <span class="queue-title-text">${v.ref}</span>
                    </div>
                    <div class="queue-controls">
                        <button class="mini-btn" onclick="moveDraftItem(${idx}, -1)" title="위로">▲</button>
                        <button class="mini-btn" onclick="moveDraftItem(${idx}, 1)" title="아래로">▼</button>
                        <button class="mini-btn danger" onclick="removeDraftItem(${idx})" title="삭제">✕</button>
                    </div>
                `;
                listEl.appendChild(row);
            });
        }

        function initMeetingData() {
            const params = new URLSearchParams(window.location.search);
            const sharedPack = params.get('pack');
            const sharedRef = params.get('ref');
            const sharedText = params.get('text');
            const sharedMemo = params.get('memo');

            let verses = [
                { id: 1, ref: "구원의 확신 (요한일서 5:11-12)", text: rawData[0].verse }
            ];
            let memo = "오늘 모임 나눔: 영생의 확신과 그 은혜에 대해 서로 나눠봅시다.";

            if (sharedPack) {
                try {
                    const parsed = JSON.parse(sharedPack);
                    if (Array.isArray(parsed.verses) && parsed.verses.length > 0) {
                        verses = parsed.verses;
                        memo = parsed.memo || "";
                    }
                } catch (e) {}
            } else if (sharedRef && sharedText) {
                verses = [{ id: 'shared_1', ref: sharedRef, text: sharedText }];
                memo = sharedMemo || "";
            } else {
                const saved = localStorage.getItem('bbb_today_meeting_v2');
                if (saved) {
                    try {
                        const parsed = JSON.parse(saved);
                        if (Array.isArray(parsed.verses) && parsed.verses.length > 0) {
                            verses = parsed.verses;
                            memo = parsed.memo || "";
                        }
                    } catch (e) {}
                }
            }

            savedVerses = JSON.parse(JSON.stringify(verses));
            draftVerses = JSON.parse(JSON.stringify(verses));
            savedMemo = memo;
            activeMeetingIdx = 0;

            document.getElementById('meeting-memo-input').value = savedMemo;
            document.getElementById('meeting-editor').style.display = 'none';

            renderSelectList('all');
            renderDraftQueue();
            renderMeetingReader();
        }

        function saveAndStartReading() {
            if (draftVerses.length === 0) {
                alert("통독할 말씀을 1개 이상 선택하거나 추가해 주세요!");
                return;
            }

            const memo = document.getElementById('meeting-memo-input').value.trim();
            savedVerses = JSON.parse(JSON.stringify(draftVerses));
            savedMemo = memo;
            activeMeetingIdx = 0;

            localStorage.setItem('bbb_today_meeting_v2', JSON.stringify({
                verses: savedVerses,
                memo: savedMemo
            }));

            renderMeetingReader();
            document.getElementById('meeting-editor').style.display = 'none';
            document.getElementById('complete-banner').style.display = 'none';
        }

        function toggleEditor() {
            const editor = document.getElementById('meeting-editor');
            const isHidden = (editor.style.display === 'none' || editor.style.display === '');
            editor.style.display = isHidden ? 'block' : 'none';
            if (isHidden) {
                document.getElementById('meeting-view').scrollTo({ top: 0, behavior: 'smooth' });
            }
        }

        function renderMeetingReader() {
            if (savedVerses.length === 0) return;
            const total = savedVerses.length;
            activeMeetingIdx = Math.max(0, Math.min(activeMeetingIdx, total - 1));
            const currentVerse = savedVerses[activeMeetingIdx];

            document.getElementById('meeting-step-indicator').innerText = `${activeMeetingIdx + 1} / ${total} 번째 말씀`;
            document.getElementById('display-meeting-ref').innerText = currentVerse.ref;

            const dotsContainer = document.getElementById('verse-dots');
            dotsContainer.innerHTML = '';
            if (total > 1) {
                savedVerses.forEach((v, idx) => {
                    const btn = document.createElement('button');
                    btn.className = 'verse-dot-btn' + (idx === activeMeetingIdx ? ' active' : '');
                    btn.innerText = `${idx + 1}. ${v.ref.split('(')[0].trim()}`;
                    btn.onclick = () => {
                        activeMeetingIdx = idx;
                        renderMeetingReader();
                    };
                    dotsContainer.appendChild(btn);
                });
            }

            const container = document.getElementById('verse-lines-container');
            container.innerHTML = '';
            highlightedLineIndex = 0;

            const lines = currentVerse.text.split(/\r?\n/).map(l => l.trim()).filter(l => l.length > 0);
            lines.forEach((line, idx) => {
                const div = document.createElement('div');
                div.className = 'verse-line' + (idx === 0 ? ' active-line' : '');
                div.innerText = line;
                div.onclick = () => setHighlight(idx);
                container.appendChild(div);
            });

            const memoBox = document.getElementById('display-meeting-memo');
            if (savedMemo) {
                memoBox.style.display = 'block';
                memoBox.innerText = "💬 " + savedMemo;
            } else {
                memoBox.style.display = 'none';
            }

            const bottomPrevBtn = document.getElementById('bottom-prev-btn');
            if (bottomPrevBtn) {
                bottomPrevBtn.disabled = (activeMeetingIdx <= 0);
            }

            const bottomBtn = document.getElementById('bottom-next-or-done-btn');
            if (activeMeetingIdx < total - 1) {
                bottomBtn.innerText = "다음 말씀 ▶";
            } else {
                bottomBtn.innerText = "🙌 오늘의 통독 완료!";
            }

            updateSideNavButtonsState();
        }

        function updateSideNavButtonsState() {
            const prevBtn = document.getElementById('prev-btn');
            const nextBtn = document.getElementById('next-btn');
            if (!isMeetingOpen()) {
                prevBtn.disabled = false;
                nextBtn.disabled = false;
                return;
            }
            prevBtn.disabled = (activeMeetingIdx <= 0);
            nextBtn.disabled = (activeMeetingIdx >= savedVerses.length - 1);
        }

        function navigateMeetingVerse(step) {
            const target = activeMeetingIdx + step;
            if (target < 0 || target >= savedVerses.length) return;
            activeMeetingIdx = target;
            document.getElementById('complete-banner').style.display = 'none';
            renderMeetingReader();
            document.getElementById('meeting-view').scrollTo({ top: 0, behavior: 'smooth' });
        }

        function handleBottomNextOrDone() {
            if (activeMeetingIdx < savedVerses.length - 1) {
                navigateMeetingVerse(1);
            } else {
                completeReading();
            }
        }

        function setHighlight(idx) {
            const lines = document.querySelectorAll('.verse-line');
            if (lines.length === 0) return;
            highlightedLineIndex = Math.max(0, Math.min(idx, lines.length - 1));
            lines.forEach((el, i) => {
                el.classList.toggle('active-line', i === highlightedLineIndex);
            });
            lines[highlightedLineIndex].scrollIntoView({ behavior: 'smooth', block: 'nearest' });
        }

        function moveHighlight(step) {
            setHighlight(highlightedLineIndex + step);
        }

        function changeFontSize(delta) {
            currentFontSize = Math.max(0.85, Math.min(1.6, currentFontSize + delta));
            document.getElementById('verse-lines-container').style.fontSize = currentFontSize + 'rem';
        }

        function completeReading() {
            const banner = document.getElementById('complete-banner');
            banner.style.display = 'block';
            banner.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
        }

        function copyShareLink() {
            if (draftVerses.length === 0) {
                alert("공유할 말씀을 1개 이상 선택해 주세요!");
                return;
            }
            const memo = document.getElementById('meeting-memo-input').value.trim();
            const pack = JSON.stringify({
                verses: draftVerses.map(v => ({ ref: v.ref, text: v.text })),
                memo: memo
            });

            const url = new URL(window.location.origin + window.location.pathname);
            url.searchParams.set('pack', pack);

            navigator.clipboard.writeText(url.toString()).then(() => {
                alert(`선택하신 ${draftVerses.length}건의 말씀이 담긴 모임 공유 링크가 복사되었습니다!\n카톡방에 붙여넣기 하시면 동일한 순서대로 통독 화면이 열립니다.`);
            }).catch(() => {
                alert("링크 복사에 실패했습니다.");
            });
        }

        renderCarousel();
        initMeetingData();
        openMeetingView();
        animateCarousel();
        loadArtPool();
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BBB 주제별 성경암송 3D 갤러리 & 오늘의 모임</title>
    <style>
        :root {
            --bg-color: #0d1117;
            --card-bg: rgba(22, 27, 34, 0.9);
            --card-border: rgba(205, 162, 110, 0.4);
            --accent-gold: #cda26e;
            --accent-gold-light: #e6c294;
            --text-main: #f0f6fc;
            --text-sub: #8b949e;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            overflow: hidden;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            position: relative;
            user-select: none;
        }

        header {
            padding: 15px 25px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 20;
            background: linear-gradient(to bottom, rgba(13,17,23,0.95), transparent);
            gap: 12px;
        }

        h1 {
            font-size: 1.2rem;
            color: var(--accent-gold);
            letter-spacing: 1px;
            font-weight: 600;
            white-space: nowrap;
        }

        .header-right {
            display: flex;
            align-items: center;
            gap: 10px;
            flex-wrap: wrap;
        }

        .filters {
            display: flex;
            gap: 8px;
            overflow-x: auto;
        }

        .filter-btn {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.12);
            color: var(--text-sub);
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 0.85rem;
            cursor: pointer;
            transition: all 0.25s ease;
            white-space: nowrap;
        }

        .filter-btn:hover, .filter-btn.active {
            background: var(--accent-gold);
            color: #000;
            border-color: var(--accent-gold);
            font-weight: 600;
        }

        .meeting-btn {
            background: rgba(205, 162, 110, 0.15);
            border: 1px solid var(--accent-gold);
            color: var(--accent-gold-light);
            padding: 7px 15px;
            border-radius: 20px;
            font-size: 0.85rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.25s ease;
            white-space: nowrap;
        }

        .meeting-btn:hover, .meeting-btn.active {
            background: var(--accent-gold);
            color: #0d1117;
        }

        .spin-btn {
            background: linear-gradient(135deg, #cda26e, #a67c46);
            color: #0d1117;
            border: none;
            padding: 8px 16px;
            border-radius: 24px;
            font-size: 0.85rem;
            font-weight: 700;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(205, 162, 110, 0.35);
            transition: all 0.25s ease;
            white-space: nowrap;
        }

        .spin-btn:hover:not(:disabled) {
            background: linear-gradient(135deg, #e6c294, #cda26e);
            transform: translateY(-1px);
            box-shadow: 0 6px 20px rgba(205, 162, 110, 0.55);
        }

        .spin-btn:disabled {
            opacity: 0.55;
            cursor: not-allowed;
        }

        #stage-container {
            flex: 1;
            perspective: 1200px;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
            cursor: grab;
        }

        #stage-container:active {
            cursor: grabbing;
        }

        .carousel-3d {
            width: 100%;
            height: 100%;
            position: absolute;
            transform-style: preserve-3d;
            display: flex;
            justify-content: center;
            align-items: center;
            transition: transform 0.35s cubic-bezier(0.25, 0.8, 0.25, 1);
        }

        .side-nav-btn {
            position: fixed;
            top: 50%;
            transform: translateY(-50%);
            z-index: 30;
            width: 52px;
            height: 52px;
            border-radius: 50%;
            background: rgba(22, 27, 34, 0.75);
            border: 1px solid rgba(205, 162, 110, 0.45);
            color: var(--accent-gold);
            font-size: 1.4rem;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            backdrop-filter: blur(8px);
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.5);
            transition: all 0.25s ease;
        }

        .side-nav-btn:hover:not(:disabled) {
            background: var(--accent-gold);
            color: #0d1117;
            transform: translateY(-50%) scale(1.08);
            box-shadow: 0 0 20px rgba(205, 162, 110, 0.4);
        }

        .side-nav-btn:disabled {
            opacity: 0.35;
            cursor: not-allowed;
        }

        .side-nav-btn.prev { left: 24px; }
        .side-nav-btn.next { right: 24px; }

        .verse-card {
            position: absolute;
            width: 280px;
            height: 380px;
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 16px;
            padding: 25px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            backdrop-filter: blur(10px);
            box-shadow: 0 15px 35px rgba(0,0,0,0.5);
            cursor: pointer;
            transition: border-color 0.3s, box-shadow 0.3s;
            backface-visibility: hidden;
        }

        .verse-card:hover {
            border-color: var(--accent-gold);
            box-shadow: 0 20px 40px rgba(205,162,110,0.25);
        }

        .card-header {
            display: flex;
            justify-content: space-between;
            font-size: 0.75rem;
            color: var(--accent-gold);
            text-transform: uppercase;
            letter-spacing: 1px;
            border-bottom: 1px solid rgba(205,162,110,0.2);
            padding-bottom: 8px;
        }

        .card-body {
            font-size: 0.95rem;
            line-height: 1.65;
            color: var(--text-main);
            word-break: keep-all;
            white-space: pre-line;
            overflow-y: auto;
            margin: 15px 0;
            flex: 1;
        }

        .card-footer {
            font-size: 0.9rem;
            font-weight: bold;
            text-align: right;
            color: var(--accent-gold);
        }

        footer {
            padding: 18px 20px;
            text-align: center;
            z-index: 20;
            background: linear-gradient(to top, rgba(13,17,23,0.95), transparent);
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
        }

        #card-counter {
            font-size: 0.95rem;
            font-weight: 600;
            color: var(--accent-gold);
            letter-spacing: 1px;
        }

        .guide-text {
            font-size: 0.8rem;
            color: var(--text-sub);
        }

        #modal {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.84);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 100;
            backdrop-filter: blur(7px);
        }

        .modal-content {
            width: 90%;
            max-width: 460px;
            min-height: 500px;
            max-height: 85vh;
            background: #161b22;
            border: 2px solid var(--accent-gold);
            border-radius: 22px;
            padding: 36px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            box-shadow: 0 25px 60px rgba(205, 162, 110, 0.25);
            position: relative;
            animation: popIn 0.35s cubic-bezier(0.18, 0.89, 0.32, 1.28);
        }

        @keyframes popIn {
            0% { transform: scale(0.85); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }

        .today-badge {
            display: none;
            align-self: center;
            background: linear-gradient(135deg, #cda26e, #e6c294);
            color: #0d1117;
            font-size: 0.85rem;
            font-weight: 800;
            padding: 5px 16px;
            border-radius: 20px;
            margin-bottom: 14px;
            letter-spacing: 1px;
        }

        .close-btn {
            position: absolute;
            top: 15px; right: 20px;
            background: none; border: none;
            color: var(--text-sub);
            font-size: 1.6rem;
            cursor: pointer;
        }
        .close-btn:hover { color: var(--accent-gold); }

        #meeting-view {
            display: none;
            position: fixed;
            top: 70px;
            left: 0;
            right: 0;
            bottom: 0;
            background: #0d1117;
            z-index: 40;
            padding: 20px;
            overflow-y: auto;
            user-select: text;
        }

        .meeting-container {
            max-width: 820px;
            margin: 0 auto 40px auto;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .meeting-card {
            background: #161b22;
            border: 1px solid var(--card-border);
            border-radius: 18px;
            padding: 24px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.4);
        }

        .meeting-title-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 10px;
            margin-bottom: 16px;
            border-bottom: 1px solid rgba(205, 162, 110, 0.25);
            padding-bottom: 12px;
        }

        .meeting-title-row h2 {
            color: var(--accent-gold);
            font-size: 1.2rem;
        }

        .meeting-actions {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }

        .action-btn {
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.15);
            color: var(--text-main);
            padding: 6px 12px;
            border-radius: 10px;
            font-size: 0.85rem;
            cursor: pointer;
            transition: all 0.2s;
        }

        .action-btn:hover {
            background: var(--accent-gold);
            color: #0d1117;
            border-color: var(--accent-gold);
            font-weight: 600;
        }

        .action-btn.primary {
            background: var(--accent-gold);
            color: #0d1117;
            border-color: var(--accent-gold);
            font-weight: 700;
        }

        .select-list-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(230px, 1fr));
            gap: 10px;
            max-height: 280px;
            overflow-y: auto;
            padding: 4px;
            margin-bottom: 15px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            background: #0d1117;
        }

        .select-item {
            background: rgba(22, 27, 34, 0.8);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 10px;
            padding: 10px 14px;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .select-item:hover {
            border-color: var(--accent-gold);
            background: rgba(205, 162, 110, 0.08);
        }

        .select-item.selected {
            background: rgba(205, 162, 110, 0.2);
            border-color: var(--accent-gold);
        }

        .select-item-cat {
            font-size: 0.7rem;
            color: var(--accent-gold);
            text-transform: uppercase;
        }

        .select-item-title {
            font-size: 0.9rem;
            font-weight: 600;
        }

        .select-item-ref {
            font-size: 0.8rem;
            color: var(--text-sub);
        }

        .input-group {
            display: flex;
            flex-direction: column;
            gap: 6px;
            margin-bottom: 12px;
        }

        .input-group label {
            font-size: 0.85rem;
            color: var(--accent-gold);
            font-weight: 600;
        }

        .input-group input, .input-group textarea {
            width: 100%;
            background: #0d1117;
            border: 1px solid rgba(205, 162, 110, 0.35);
            border-radius: 10px;
            padding: 10px 12px;
            color: var(--text-main);
            font-size: 0.95rem;
            font-family: inherit;
        }

        .input-group textarea {
            min-height: 100px;
            line-height: 1.6;
            resize: vertical;
        }

        .input-group input:focus, .input-group textarea:focus {
            outline: none;
            border-color: var(--accent-gold);
        }

        .reader-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 10px;
            margin-bottom: 18px;
        }

        .reader-ref {
            font-size: 1.3rem;
            font-weight: 700;
            color: var(--accent-gold);
        }

        .verse-lines {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .verse-line {
            padding: 14px 18px;
            border-radius: 12px;
            background: rgba(255, 255, 255, 0.03);
            border-left: 3px solid transparent;
            line-height: 1.75;
            word-break: keep-all;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .verse-line:hover {
            background: rgba(205, 162, 110, 0.08);
        }

        .verse-line.active-line {
            background: rgba(205, 162, 110, 0.16);
            border-left-color: var(--accent-gold);
            color: #ffffff;
            font-weight: 600;
        }

        .meeting-memo-box {
            margin-top: 20px;
            padding: 14px 18px;
            border-radius: 12px;
            background: rgba(205, 162, 110, 0.08);
            border: 1px dashed rgba(205, 162, 110, 0.4);
            font-size: 0.92rem;
            color: var(--accent-gold-light);
            white-space: pre-line;
        }

        .complete-banner {
            display: none;
            margin-top: 18px;
            padding: 16px;
            border-radius: 12px;
            background: linear-gradient(135deg, rgba(205, 162, 110, 0.25), rgba(166, 124, 70, 0.25));
            border: 1px solid var(--accent-gold);
            text-align: center;
            font-weight: 700;
            color: var(--accent-gold-light);
        }

        @media (max-width: 768px) {
            header { flex-direction: column; align-items: flex-start; padding: 12px 16px; }
            #meeting-view { top: 105px; padding: 14px; }
            .verse-card { width: 230px; height: 320px; padding: 18px; }
            .side-nav-btn { width: 42px; height: 42px; font-size: 1.1rem; }
            .side-nav-btn.prev { left: 10px; }
            .side-nav-btn.next { right: 10px; }
        }
    </style>
</head>
<body>

    <header>
        <h1>BBB 3D Scripture Gallery</h1>
        <div class="header-right">
            <div class="filters">
                <button class="filter-btn active" onclick="switchToGallery('all', this)">전체</button>
                <button class="filter-btn" onclick="switchToGallery('5확신', this)">5확신</button>
                <button class="filter-btn" onclick="switchToGallery('8지침', this)">8지침</button>
                <button class="filter-btn" onclick="switchToGallery('60구절', this)">60구절</button>
            </div>
            <button id="meeting-menu-btn" class="meeting-btn" onclick="openMeetingView()">📖 오늘의 모임</button>
            <button id="spin-btn" class="spin-btn" onclick="spinTodayVerse()">✨ 오늘의 말씀 뽑기</button>
        </div>
    </header>

    <button id="prev-btn" class="side-nav-btn prev" onclick="rotateCarousel(-1)" aria-label="이전 카드">&#10094;</button>
    <button id="next-btn" class="side-nav-btn next" onclick="rotateCarousel(1)" aria-label="다음 카드">&#10095;</button>

    <div id="stage-container">
        <div class="carousel-3d" id="carousel"></div>
    </div>

    <footer id="gallery-footer">
        <div id="card-counter">1 / 15</div>
        <div class="guide-text">'오늘의 말씀 뽑기'로 말씀을 뽑거나 '오늘의 모임'에서 함께 통독하세요.</div>
    </footer>

    <div id="modal" onclick="closeModal()">
        <div class="modal-content" onclick="event.stopPropagation()">
            <button class="close-btn" onclick="closeModal()">&times;</button>
            <div id="today-badge" class="today-badge">✨ 오늘의 말씀</div>
            <div id="modal-header" class="card-header"></div>
            <div id="modal-body" class="card-body" style="font-size: 1.15rem; line-height: 1.85;"></div>
            <div id="modal-footer" class="card-footer" style="font-size: 1.1rem;"></div>
        </div>
    </div>

    <div id="meeting-view">
        <div class="meeting-container">
            <div id="meeting-editor" class="meeting-card">
                <div class="meeting-title-row">
                    <h2>📖 오늘의 모임 통독 설정</h2>
                    <div class="meeting-actions">
                        <button class="action-btn" onclick="closeMeetingView()">3D 갤러리로 돌아가기</button>
                    </div>
                </div>

                <div class="input-group">
                    <label>전체 리스트에서 말씀 선택하기 (클릭하면 바로 세팅됩니다)</label>
                    <div style="display: flex; gap: 6px; margin-bottom: 8px;">
                        <button class="action-btn active" onclick="filterMeetingList('all', this)">전체</button>
                        <button class="action-btn" onclick="filterMeetingList('5확신', this)">5확신</button>
                        <button class="action-btn" onclick="filterMeetingList('8지침', this)">8지침</button>
                        <button class="action-btn" onclick="filterMeetingList('60구절', this)">60구절</button>
                    </div>
                    <div id="select-list-grid" class="select-list-grid"></div>
                </div>

                <div class="input-group">
                    <label for="meeting-ref-input">선택된 장절</label>
                    <input type="text" id="meeting-ref-input" placeholder="예: 요한일서 5:11-12">
                </div>
                <div class="input-group">
                    <label for="meeting-text-input">통독 본문 내용</label>
                    <textarea id="meeting-text-input" placeholder="위 목록에서 카드를 누르거나 본문을 직접 입력하세요..."></textarea>
                </div>
                <div class="input-group">
                    <label for="meeting-memo-input">모임 나눔 주제 / 기도제목 (선택)</label>
                    <input type="text" id="meeting-memo-input" placeholder="예: 오늘 말씀에서 은혜받은 부분 나누기">
                </div>
                <div style="display: flex; gap: 10px; justify-content: flex-end; flex-wrap: wrap; margin-top: 5px;">
                    <button class="action-btn" onclick="copyShareLink()">🔗 모임 공유 링크 복사</button>
                    <button class="action-btn primary" onclick="saveAndStartReading()">저장하고 다같이 통독하기 ▶</button>
                </div>
            </div>

            <div id="meeting-reader" class="meeting-card">
                <div class="reader-header">
                    <div class="reader-ref" id="display-meeting-ref">시편 23:1-6</div>
                    <div class="meeting-actions">
                        <button class="action-btn" onclick="changeFontSize(-0.1)">가-</button>
                        <button class="action-btn" onclick="changeFontSize(0.1)">가+</button>
                        <button class="action-btn" onclick="moveHighlight(-1)">▲ 이전 줄</button>
                        <button class="action-btn" onclick="moveHighlight(1)">▼ 다음 줄</button>
                        <button class="action-btn" onclick="toggleEditor()">✏️ 말씀 선택/수정</button>
                    </div>
                </div>

                <div id="verse-lines-container" class="verse-lines" style="font-size: 1.15rem;"></div>

                <div id="display-meeting-memo" class="meeting-memo-box" style="display: none;"></div>

                <div style="margin-top: 20px; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 10px;">
                    <span style="font-size: 0.85rem; color: var(--text-sub);">문장을 클릭하면 읽고 있는 줄이 강조됩니다.</span>
                    <button class="action-btn primary" onclick="completeReading()">🙌 오늘의 통독 완료!</button>
                </div>

                <div id="complete-banner" class="complete-banner">
                    아멘! 오늘의 모임 말씀을 모두 함께 통독했습니다. 🙏
                </div>
            </div>
        </div>
    </div>

    <script>
        const rawData = [
            { id: 1, category: "5확신", title: "구원의 확신", reference: "요한일서 5:11-12", verse: "또 증거는 이것이니\n하나님이 우리에게 영생을 주신 것과\n이 생명이 그의 아들 안에 있는 그것이니라\n아들이 있는 자에게는 생명이 있고\n하나님의 아들이 없는 자에게는 생명이 없느니라" },
            { id: 2, category: "5확신", title: "기도응답의 확신", reference: "요한복음 16:24", verse: "지금까지는 너희가 내 이름으로 아무 것도 구하지 아니하였으나\n구하라 그리하면 받으리니\n너희 기쁨이 충만하리라" },
            { id: 3, category: "5확신", title: "승리의 확신", reference: "고린도전서 10:13", verse: "사람이 감당할 시험 밖에는\n너희가 당한 것이 없나니\n오직 하나님은 미쁘사\n너희가 감당하지 못할 시험 당함을 허락하지 아니하시고\n시험 당할 즈음에 또한 피할 길을 내사\n너희로 능히 감당하게 하시느니라" },
            { id: 4, category: "5확신", title: "사죄의 확신", reference: "요한일서 1:9", verse: "만일 우리가 우리 죄를 자백하면\n그는 미쁘시고 의로우사\n우리 죄를 사하시며\n우리를 모든 불의에서 깨끗하게 하실 것이요" },
            { id: 5, category: "5확신", title: "인도의 확신", reference: "잠언 3:5-6", verse: "너는 마음을 다하여 여호와를 신뢰하고\n네 명철을 의지하지 말라\n너는 범사에 그를 인정하라\n그리하면 네 길을 지도하시리라" },
            
            { id: 6, category: "8지침", title: "그리스도 안의 생활", reference: "요한복음 15:5", verse: "나는 포도나무요 너희는 가지라\n그가 내 안에, 내가 그 안에 거하면\n사람이 열매를 많이 맺나니\n나를 떠나서는 너희가 아무 것도 할 수 없음이라" },
            { id: 7, category: "8지침", title: "말씀에 의한 생활", reference: "사도행전 20:32", verse: "지금 내가 여러분을 주와 및 그 은혜의 말씀에 부탁하노니\n그 말씀이 여러분을 능히 든든히 세우사\n거룩하게 하심을 입은 모든 자 가운데\n기업이 있게 하시리라" },
            { id: 8, category: "8지침", title: "성령에 의한 생활", reference: "로마서 8:14", verse: "무릇 하나님의 영으로 인도함을 받는 사람은\n곧 하나님의 아들이라" },
            { id: 9, category: "8지침", title: "믿음에 의한 생활", reference: "고린도후서 5:7", verse: "이는 우리가 믿음으로 행하고\n보는 것으로 행하지 아니함이로라" },
            { id: 10, category: "8지침", title: "사랑에 의한 생활", reference: "요한일서 4:11", verse: "사랑하는 자들아\n하나님이 이같이 우리를 사랑하셨은즉\n우리도 서로 사랑하는 것이 마땅하도다" },

            { id: 11, category: "60구절", title: "새로운 삶 : 중심", reference: "고린도후서 5:17", verse: "그런즉 누구든지 그리스도 안에 있으면\n새로운 피조물이라\n이전 것은 지나갔으니\n보라 새것이 되었도다" },
            { id: 12, category: "60구절", title: "새로운 삶 : 헌신", reference: "갈라디아서 2:20", verse: "내가 그리스도와 함께 십자가에 못 박혔나니\n그런즉 이제는 내가 사는 것이 아니요\n오직 내 안에 그리스도께서 사시는 것이라" },
            { id: 13, category: "60구절", title: "새로운 삶 : 순종", reference: "로마서 12:1", verse: "그러므로 형제들아 내가 하나님의 모든 자비하심으로 너희를 권하노니\n너희 몸을 하나님이 기뻐하시는 거룩한 산 제물로 드리라\n이는 너희가 드릴 영적 예배니라" },
            { id: 14, category: "60구절", title: "새로운 삶 : 말씀", reference: "여호수아 1:8", verse: "이 율법책을 네 입에서 떠나지 말게 하며\n주야로 그것을 묵상하여\n그 안에 기록된 대로 다 지켜 행하라\n그리하면 네 길이 평탄하게 될 것이며\n네가 형통하리라" },
            { id: 15, category: "60구절", title: "새로운 삶 : 기도", reference: "빌립보서 4:6-7", verse: "아무 것도 염려하지 말고\n다만 모든 일에 기도와 간구로,\n너희 구할 것을 감사함으로 하나님께 아뢰라\n그리하면 모든 지각에 뛰어난 하나님의 평강이\n너희 마음과 생각을 지키시리라" }
        ];

        let currentData = [...rawData];
        let currentIndex = 0;
        let angleY = 0;
        let radius = 420;
        let dragMoved = false;
        let isSpinning = false;

        const carousel = document.getElementById('carousel');
        const counter = document.getElementById('card-counter');

        function renderCarousel() {
            carousel.innerHTML = '';
            const total = currentData.length;
            const theta = 360 / total;

            currentData.forEach((item, index) => {
                const card = document.createElement('div');
                card.className = 'verse-card';
                card.innerHTML = `
                    <div class="card-header">
                        <span>${item.category}</span>
                        <span>${item.title}</span>
                    </div>
                    <div class="card-body">${item.verse.replace(/\n/g, '<br>')}</div>
                    <div class="card-footer">${item.reference}</div>
                `;

                const cardAngle = theta * index;
                card.style.transform = `rotateY(${cardAngle}deg) translateZ(${radius}px)`;
                
                card.onclick = () => {
                    if (!dragMoved && !isSpinning) openModal(item, false);
                };
                carousel.appendChild(card);
            });
            updateTransform();
        }

        function updateTransform() {
            carousel.style.transform = `rotateY(${angleY}deg)`;
            const total = currentData.length;
            const activeIdx = Math.round((-angleY / (360 / total))) % total;
            const normalizedIdx = (activeIdx + total) % total;
            currentIndex = normalizedIdx;
            counter.innerText = `${currentIndex + 1} / ${total}`;
        }

        function rotateCarousel(direction) {
            if (isSpinning) return;
            const total = currentData.length;
            const theta = 360 / total;
            carousel.style.transition = 'transform 0.35s cubic-bezier(0.25, 0.8, 0.25, 1)';
            angleY -= direction * theta;
            updateTransform();
        }

        function spinTodayVerse() {
            if (isSpinning || currentData.length === 0) return;
            closeMeetingView();
            isSpinning = true;

            const spinBtn = document.getElementById('spin-btn');
            const prevBtn = document.getElementById('prev-btn');
            const nextBtn = document.getElementById('next-btn');
            spinBtn.disabled = true;
            prevBtn.disabled = true;
            nextBtn.disabled = true;
            spinBtn.innerText = "말씀을 뽑는 중...";

            const total = currentData.length;
            const theta = 360 / total;
            const targetIndex = Math.floor(Math.random() * total);

            const extraSpins = (4 + Math.floor(Math.random() * 3)) * 360;
            const targetBaseAngle = -targetIndex * theta;
            const currentMod = ((angleY % 360) + 360) % 360;
            const targetMod = ((targetBaseAngle % 360) + 360) % 360;
            let diff = targetMod - currentMod;
            if (diff > 0) diff -= 360;

            angleY = angleY - extraSpins + diff;

            carousel.style.transition = 'transform 3.6s cubic-bezier(0.12, 0.85, 0.18, 1)';
            updateTransform();

            setTimeout(() => {
                isSpinning = false;
                spinBtn.disabled = false;
                prevBtn.disabled = false;
                nextBtn.disabled = false;
                spinBtn.innerText = "✨ 오늘의 말씀 뽑기";

                openModal(currentData[targetIndex], true);
            }, 3750);
        }

        function switchToGallery(cat, btnElement) {
            if (isSpinning) return;
            closeMeetingView();

            document.querySelectorAll('.filter-btn').forEach(btn => btn.classList.remove('active'));
            if (btnElement) btnElement.classList.add('active');

            if (cat === 'all') {
                currentData = [...rawData];
            } else {
                currentData = rawData.filter(item => item.category === cat);
            }
            angleY = 0;
            carousel.style.transition = 'transform 0.35s ease';
            renderCarousel();
        }

        let isDragging = false;
        let startX = 0;
        const stage = document.getElementById('stage-container');

        stage.addEventListener('mousedown', (e) => {
            if (isSpinning) return;
            isDragging = true;
            dragMoved = false;
            startX = e.clientX;
            carousel.style.transition = 'none';
        });

        window.addEventListener('mousemove', (e) => {
            if (!isDragging || isSpinning) return;
            const deltaX = e.clientX - startX;
            if (Math.abs(deltaX) > 4) dragMoved = true;
            startX = e.clientX;
            angleY += deltaX * 0.4;
            updateTransform();
        });

        window.addEventListener('mouseup', () => {
            isDragging = false;
            setTimeout(() => { dragMoved = false; }, 50);
        });

        stage.addEventListener('touchstart', (e) => {
            if (isSpinning) return;
            isDragging = true;
            dragMoved = false;
            startX = e.touches[0].clientX;
            carousel.style.transition = 'none';
        });

        window.addEventListener('touchmove', (e) => {
            if (!isDragging || isSpinning) return;
            const deltaX = e.touches[0].clientX - startX;
            if (Math.abs(deltaX) > 4) dragMoved = true;
            startX = e.touches[0].clientX;
            angleY += deltaX * 0.4;
            updateTransform();
        });

        window.addEventListener('touchend', () => {
            isDragging = false;
            setTimeout(() => { dragMoved = false; }, 50);
        });

        stage.addEventListener('wheel', (e) => {
            if (isSpinning || document.getElementById('meeting-view').style.display === 'block') return;
            e.preventDefault();
            carousel.style.transition = 'transform 0.1s ease-out';
            angleY += e.deltaY * 0.2;
            updateTransform();
        }, { passive: false });

        window.addEventListener('keydown', (e) => {
            if (document.getElementById('meeting-view').style.display === 'block') {
                if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') return;
                if (e.key === 'ArrowUp') moveHighlight(-1);
                if (e.key === 'ArrowDown') moveHighlight(1);
                return;
            }
            if (e.key === 'ArrowLeft') rotateCarousel(-1);
            if (e.key === 'ArrowRight') rotateCarousel(1);
            if (e.key === 'Escape') closeModal();
        });

        function openModal(item, isTodayPick = false) {
            const badge = document.getElementById('today-badge');
            badge.style.display = isTodayPick ? 'inline-block' : 'none';

            document.getElementById('modal-header').innerHTML = `<span>${item.category}</span><span>${item.title}</span>`;
            document.getElementById('modal-body').innerHTML = item.verse.replace(/\n/g, '<br>');
            document.getElementById('modal-footer').innerText = item.reference;
            document.getElementById('modal').style.display = 'flex';
        }

        function closeModal() {
            document.getElementById('modal').style.display = 'none';
        }

        let currentFontSize = 1.15;
        let highlightedLineIndex = 0;
        let selectedMeetingItem = null;

        function openMeetingView() {
            if (isSpinning) return;
            document.getElementById('meeting-view').style.display = 'block';
            document.getElementById('meeting-menu-btn').classList.add('active');
            document.getElementById('prev-btn').style.display = 'none';
            document.getElementById('next-btn').style.display = 'none';
            renderSelectList('all');
            initMeetingData();
        }

        function closeMeetingView() {
            document.getElementById('meeting-view').style.display = 'none';
            document.getElementById('meeting-menu-btn').classList.remove('active');
            document.getElementById('prev-btn').style.display = 'flex';
            document.getElementById('next-btn').style.display = 'flex';
        }

        function renderSelectList(cat) {
            const grid = document.getElementById('select-list-grid');
            grid.innerHTML = '';
            let list = rawData;
            if (cat !== 'all') {
                list = rawData.filter(i => i.category === cat);
            }

            list.forEach(item => {
                const div = document.createElement('div');
                div.className = 'select-item' + (selectedMeetingItem && selectedMeetingItem.id === item.id ? ' selected' : '');
                div.innerHTML = `
                    <div class="select-item-cat">${item.category}</div>
                    <div class="select-item-title">${item.title}</div>
                    <div class="select-item-ref">${item.reference}</div>
                `;
                div.onclick = () => selectMeetingVerse(item, div);
                grid.appendChild(div);
            });
        }

        function filterMeetingList(cat, btn) {
            document.querySelectorAll('#meeting-editor .action-btn').forEach(b => {
                if(!b.textContent.includes('돌아가기') && !b.textContent.includes('링크') && !b.textContent.includes('시작하기')) {
                    b.classList.remove('active', 'primary');
                }
            });
            btn.classList.add('active');
            renderSelectList(cat);
        }

        function selectMeetingVerse(item, el) {
            document.querySelectorAll('.select-item').forEach(i => i.classList.remove('selected'));
            el.classList.add('selected');
            selectedMeetingItem = item;

            document.getElementById('meeting-ref-input').value = `${item.title} (${item.reference})`;
            document.getElementById('meeting-text-input').value = item.verse.replace(/\n/g, '\n');
        }

        function initMeetingData() {
            const params = new URLSearchParams(window.location.search);
            const sharedRef = params.get('ref');
            const sharedText = params.get('text');
            const sharedMemo = params.get('memo');

            let data = {
                ref: "구원의 확신 (요한일서 5:11-12)",
                text: rawData[0].verse.replace(/\n/g, '\n'),
                memo: "오늘 모임 나눔: 영생의 확신과 그 은혜에 대해 서로 나눠봅시다."
            };

            if (sharedRef && sharedText) {
                data = { ref: sharedRef, text: sharedText, memo: sharedMemo || "" };
                document.getElementById('meeting-editor').style.display = 'none';
            } else {
                const saved = localStorage.getItem('bbb_today_meeting');
                if (saved) {
                    data = JSON.parse(saved);
                }
            }

            document.getElementById('meeting-ref-input').value = data.ref;
            document.getElementById('meeting-text-input').value = data.text;
            document.getElementById('meeting-memo-input').value = data.memo || "";

            renderMeetingReader(data);
        }

        function saveAndStartReading() {
            const ref = document.getElementById('meeting-ref-input').value.trim() || "오늘의 통독 말씀";
            const text = document.getElementById('meeting-text-input').value.trim();
            const memo = document.getElementById('meeting-memo-input').value.trim();

            if (!text) {
                alert("목록에서 말씀을 선택하거나 본문을 입력해 주세요!");
                return;
            }

            const data = { ref, text, memo };
            localStorage.setItem('bbb_today_meeting', JSON.stringify(data));
            renderMeetingReader(data);

            document.getElementById('meeting-editor').style.display = 'none';
            document.getElementById('complete-banner').style.display = 'none';
        }

        function toggleEditor() {
            const editor = document.getElementById('meeting-editor');
            editor.style.display = (editor.style.display === 'none') ? 'block' : 'none';
        }

        function renderMeetingReader(data) {
            document.getElementById('display-meeting-ref').innerText = data.ref;
            const container = document.getElementById('verse-lines-container');
            container.innerHTML = '';
            highlightedLineIndex = 0;

            const lines = data.text.split(/\n|
/).map(l => l.trim()).filter(l => l.length > 0);
            lines.forEach((line, idx) => {
                const div = document.createElement('div');
                div.className = 'verse-line' + (idx === 0 ? ' active-line' : '');
                div.innerText = line;
                div.onclick = () => setHighlight(idx);
                container.appendChild(div);
            });

            const memoBox = document.getElementById('display-meeting-memo');
            if (data.memo) {
                memoBox.style.display = 'block';
                memoBox.innerText = "💬 " + data.memo;
            } else {
                memoBox.style.display = 'none';
            }
        }

        function setHighlight(idx) {
            const lines = document.querySelectorAll('.verse-line');
            if (lines.length === 0) return;
            highlightedLineIndex = Math.max(0, Math.min(idx, lines.length - 1));
            lines.forEach((el, i) => {
                el.classList.toggle('active-line', i === highlightedLineIndex);
            });
            lines[highlightedLineIndex].scrollIntoView({ behavior: 'smooth', block: 'nearest' });
        }

        function moveHighlight(step) {
            setHighlight(highlightedLineIndex + step);
        }

        function changeFontSize(delta) {
            currentFontSize = Math.max(0.9, Math.min(1.8, currentFontSize + delta));
            document.getElementById('verse-lines-container').style.fontSize = currentFontSize + 'rem';
        }

        function completeReading() {
            const banner = document.getElementById('complete-banner');
            banner.style.display = 'block';
            banner.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
        }

        function copyShareLink() {
            const ref = document.getElementById('meeting-ref-input').value.trim();
            const text = document.getElementById('meeting-text-input').value.trim();
            const memo = document.getElementById('meeting-memo-input').value.trim();

            if (!text) {
                alert("공유할 말씀을 먼저 선택하거나 입력해 주세요!");
                return;
            }

            const url = new URL(window.location.origin + window.location.pathname);
            url.searchParams.set('ref', ref || "오늘의 통독 말씀");
            url.searchParams.set('text', text);
            if (memo) url.searchParams.set('memo', memo);

            navigator.clipboard.writeText(url.toString()).then(() => {
                alert("모임원에게 공유할 수 있는 링크가 복사되었습니다!\n카톡방에 붙여넣기 하시면 동일한 말씀 화면이 바로 열립니다.");
            }).catch(() => {
                alert("링크 복사에 실패했습니다.");
            });
        }

        window.addEventListener('DOMContentLoaded', () => {
            const params = new URLSearchParams(window.location.search);
            if (params.get('text')) {
                openMeetingView();
            }
        });

        renderCarousel();
    </script>
</body>
</html>
